<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="DH Pricing Hub — nền tảng báo giá vật tư và nhân công cho doanh nghiệp M&E."
    />
    <title>DH Pricing Hub</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <!-- A small inline icon sprite keeps the UI dependency-free and works offline. -->
    <svg class="icon-sprite" aria-hidden="true">
      <symbol id="i-grid" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="7" rx="1.2"></rect>
        <rect x="14" y="3" width="7" height="7" rx="1.2"></rect>
        <rect x="3" y="14" width="7" height="7" rx="1.2"></rect>
        <rect x="14" y="14" width="7" height="7" rx="1.2"></rect>
      </symbol>
      <symbol id="i-upload" viewBox="0 0 24 24">
        <path d="M12 16V4"></path>
        <path d="m7 9 5-5 5 5"></path>
        <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"></path>
      </symbol>
      <symbol id="i-file" viewBox="0 0 24 24">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"></path>
        <path d="M14 3v6h6"></path>
        <path d="M8 13h8M8 17h6"></path>
      </symbol>
      <symbol id="i-file-plus" viewBox="0 0 24 24">
        <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"></path>
        <path d="M14 3v6h6"></path>
        <path d="M12 13v5M9.5 15.5h5"></path>
      </symbol>
      <symbol id="i-chevron-down" viewBox="0 0 24 24">
        <path d="m6 9 6 6 6-6"></path>
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6"></path>
      </symbol>
      <symbol id="i-arrow-right" viewBox="0 0 24 24">
        <path d="M5 12h14"></path>
        <path d="m13 6 6 6-6 6"></path>
      </symbol>
      <symbol id="i-search" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="6.8"></circle>
        <path d="m16 16 5 5"></path>
      </symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24">
        <path d="M20 11a8.1 8.1 0 0 0-14.5-4.9L3 9"></path>
        <path d="M3 4v5h5"></path>
        <path d="M4 13a8.1 8.1 0 0 0 14.5 4.9L21 15"></path>
        <path d="M21 20v-5h-5"></path>
      </symbol>
      <symbol id="i-download" viewBox="0 0 24 24">
        <path d="M12 4v12"></path>
        <path d="m7 11 5 5 5-5"></path>
        <path d="M4 20h16"></path>
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="m5 12 4 4L19 6"></path>
      </symbol>
      <symbol id="i-check-circle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="m8 12 2.7 2.7L16.5 9"></path>
      </symbol>
      <symbol id="i-alert" viewBox="0 0 24 24">
        <path d="M10.4 4.2 3 17a2 2 0 0 0 1.7 3h14.6a2 2 0 0 0 1.7-3L13.6 4.2a1.8 1.8 0 0 0-3.2 0Z"></path>
        <path d="M12 9v4M12 17h.01"></path>
      </symbol>
      <symbol id="i-info" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 10v6M12 7h.01"></path>
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="m6 6 12 12M18 6 6 18"></path>
      </symbol>
      <symbol id="i-menu" viewBox="0 0 24 24">
        <path d="M4 7h16M4 12h16M4 17h16"></path>
      </symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24">
        <path d="M4 6h16M4 12h16M4 18h16"></path>
        <circle cx="9" cy="6" r="2"></circle>
        <circle cx="15" cy="12" r="2"></circle>
        <circle cx="10" cy="18" r="2"></circle>
      </symbol>
      <symbol id="i-database" viewBox="0 0 24 24">
        <ellipse cx="12" cy="5" rx="8" ry="3"></ellipse>
        <path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5"></path>
        <path d="M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"></path>
      </symbol>
      <symbol id="i-layers" viewBox="0 0 24 24">
        <path d="m12 3 9 5-9 5-9-5 9-5Z"></path>
        <path d="m3 12 9 5 9-5M3 16l9 5 9-5"></path>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5Z"></path>
        <path d="M4 5.5v16M8 7h8M8 11h8"></path>
      </symbol>
      <symbol id="i-more" viewBox="0 0 24 24">
        <circle cx="5" cy="12" r="1"></circle>
        <circle cx="12" cy="12" r="1"></circle>
        <circle cx="19" cy="12" r="1"></circle>
      </symbol>
      <symbol id="i-filter" viewBox="0 0 24 24">
        <path d="M4 6h16M7 12h10M10 18h4"></path>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="m9 6 9 6-9 6V6Z"></path>
      </symbol>
      <symbol id="i-pen" viewBox="0 0 24 24">
        <path d="m4 16-.8 4.8L8 20l11.2-11.2a2.8 2.8 0 0 0-4-4L4 16Z"></path>
        <path d="m13.5 6.5 4 4"></path>
      </symbol>
      <symbol id="i-external" viewBox="0 0 24 24">
        <path d="M14 4h6v6M20 4l-9 9"></path>
        <path d="M19 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5"></path>
      </symbol>
      <symbol id="i-spark" viewBox="0 0 24 24">
        <path d="m12 2 1.5 6.5L20 10l-6.5 1.5L12 18l-1.5-6.5L4 10l6.5-1.5L12 2Z"></path>
        <path d="m19 16 .7 2.3L22 19l-2.3.7L19 22l-.7-2.3L16 19l2.3-.7L19 16Z"></path>
      </symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24">
        <rect x="4" y="5" width="16" height="15" rx="2"></rect>
        <path d="M8 3v4M16 3v4M4 10h16"></path>
      </symbol>
      <symbol id="i-building" viewBox="0 0 24 24">
        <path d="M4 21V5l8-3 8 3v16"></path>
        <path d="M8 8h1M15 8h1M8 12h1M15 12h1M8 16h1M15 16h1M11 21v-4h2v4"></path>
      </symbol>
    </svg>

    <div id="app-shell" class="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Điều hướng chính">
        <div class="brand-lockup">
          <div class="brand-mark" aria-hidden="true">DH</div>
          <div>
            <div class="brand-name">Pricing Hub</div>
            <div class="brand-subtitle">M&amp;E • Nội bộ</div>
          </div>
          <button type="button" class="icon-button sidebar-close" id="sidebar-close" aria-label="Đóng menu">
            <svg><use href="#i-x"></use></svg>
          </button>
        </div>

        <div class="sidebar-section-label">Không gian làm việc</div>
        <nav class="primary-nav">
          <button type="button" class="nav-item is-active" data-route="dashboard">
            <svg><use href="#i-grid"></use></svg>
            <span>Tổng quan</span>
          </button>
          <button type="button" class="nav-item" data-route="import">
            <svg><use href="#i-upload"></use></svg>
            <span>Kho dữ liệu</span>
            <span class="nav-count" id="nav-source-count"></span>
          </button>
          <button type="button" class="nav-item" data-route="quotations">
            <svg><use href="#i-file"></use></svg>
            <span>Báo giá</span>
          </button>
          <button type="button" class="nav-item" data-route="catalog">
            <svg><use href="#i-database"></use></svg>
            <span>Danh mục &amp; giá</span>
          </button>
          <button type="button" class="nav-item" data-route="benchmark">
            <svg><use href="#i-layers"></use></svg>
            <span>Đánh giá độ phủ</span>
          </button>
        </nav>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section-label">Trợ giúp</div>
        <button type="button" class="nav-item nav-item-muted" id="open-guide">
          <svg><use href="#i-info"></use></svg>
          <span>Hướng dẫn nhanh</span>
        </button>

        <div class="sidebar-footer">
          <div class="api-health" id="api-health">
            <span class="health-dot" aria-hidden="true"></span>
            <span class="api-health-label">Đang kiểm tra kết nối…</span>
          </div>
          <div class="ai-health" id="ai-health" role="status" aria-live="polite" title="Trạng thái semantic assistance">
            <span class="health-dot" aria-hidden="true"></span>
            <span class="ai-health-label">AI semantic: đang kiểm tra…</span>
          </div>
          <div class="privacy-note">
            <svg><use href="#i-check-circle"></use></svg>
            <span>API key chỉ dùng ở máy chủ</span>
          </div>
        </div>
      </aside>

      <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

      <main class="main-content">
        <header class="topbar">
          <div class="topbar-left">
            <button type="button" class="icon-button menu-toggle" id="menu-toggle" aria-label="Mở menu">
              <svg><use href="#i-menu"></use></svg>
            </button>
            <div class="breadcrumb" id="breadcrumb">
              <span>Không gian làm việc</span>
              <svg><use href="#i-chevron-right"></use></svg>
              <strong>Tổng quan</strong>
            </div>
          </div>
          <div class="topbar-actions">
            <button type="button" class="button button-secondary button-small" id="global-refresh">
              <svg><use href="#i-refresh"></use></svg>
              <span>Làm mới</span>
            </button>
            <button type="button" class="avatar" aria-label="Tài khoản người dùng">DH</button>
          </div>
        </header>

        <div id="page-view" class="page-view" tabindex="-1"></div>
      </main>
    </div>

    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>

    <script src="/static/app.js" defer></script>
  </body>
</html>
